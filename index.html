<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🛡️ 内容安全舆情监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        /* ===== CSS 变量 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-body: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.70);
            --bg-card-solid: #ffffff;
            --text-primary: #0b1121;
            --text-secondary: #3b4a5e;
            --border-color: rgba(255, 255, 255, 0.35);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.15);
            --radius: 20px;
            --link-color: #2563eb;
            --link-hover: #1d4ed8;
            --gradient-primary: linear-gradient(135deg, #38bdf8, #818cf8);
            --gradient-danger: linear-gradient(135deg, #f87171, #f43f5e);
            --gradient-warning: linear-gradient(135deg, #fbbf24, #f59e0b);
            --gradient-success: linear-gradient(135deg, #34d399, #60a5fa);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --table-header-bg: rgba(241, 245, 249, 0.6);
            --risk-high: #f43f5e;
            --risk-medium: #f59e0b;
            --risk-low: #34d399;
        }
        [data-theme="dark"] {
            --bg-body: #0b1121;
            --bg-card: rgba(26, 35, 50, 0.75);
            --bg-card-solid: #1a2332;
            --text-primary: #f0f4f8;
            --text-secondary: #9aa9b9;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-bg: rgba(26, 35, 50, 0.6);
            --table-header-bg: rgba(30, 41, 59, 0.6);
            --link-color: #6ea8fe;
            --link-hover: #9ec8ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card-solid {
            background: var(--bg-card-solid);
            backdrop-filter: none;
            border: 1px solid var(--border-color);
        }
        /* ===== 导航 ===== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 12px 0 4px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .navbar-brand .logo-icon {
            font-size: 2rem;
            -webkit-text-fill-color: initial;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--glass-bg);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            -webkit-text-fill-color: var(--text-secondary);
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            user-select: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            box-shadow: 0 8px 28px rgba(56, 189, 248, 0.35);
        }
        .btn-danger {
            background: var(--gradient-danger);
            color: white;
            border: none;
        }
        .btn-danger:hover {
            box-shadow: 0 8px 28px rgba(244, 67, 54, 0.35);
        }
        .btn-success {
            background: var(--gradient-success);
            color: white;
            border: none;
        }
        .btn-success:hover {
            box-shadow: 0 8px 28px rgba(52, 211, 153, 0.35);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: var(--glass-bg);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== 统计卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card-solid);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(56, 189, 248, 0.2);
        }
        /* 只有"总事件"可点击 */
        .stat-card.clickable {
            cursor: pointer;
        }
        .stat-card.clickable:hover {
            border-color: var(--link-color);
            box-shadow: 0 8px 32px rgba(56, 189, 248, 0.15);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .stat-number.danger {
            background: var(--gradient-danger);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.warning {
            background: var(--gradient-warning);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.success {
            background: var(--gradient-success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }
        .stat-hint {
            font-size: 0.65rem;
            color: var(--link-color);
            margin-top: 2px;
            opacity: 0.7;
        }

        /* ===== 图表行 ===== */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 700px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
        .chart-box {
            background: var(--bg-card-solid);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .chart-box h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }
        .chart-container {
            position: relative;
            height: 200px;
        }

        /* ===== 高风险摘要 ===== */
        .high-risk-summary {
            background: var(--bg-card-solid);
            border-radius: 16px;
            padding: 16px 20px;
            border-left: 4px solid #f43f5e;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .high-risk-summary h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .high-risk-summary ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .high-risk-summary li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .high-risk-summary li:last-child {
            border-bottom: none;
        }
        .high-risk-summary .risk-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }
        .high-risk-summary .risk-link:hover {
            text-decoration: underline;
        }
        .high-risk-summary .source-tag {
            font-size: 0.7rem;
            background: var(--glass-bg);
            padding: 2px 10px;
            border-radius: 20px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .high-risk-summary .risk-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(244, 67, 54, 0.15);
            color: #f43f5e;
        }

        /* ===== 周报总结 ===== */
        .weekly-summary {
            background: var(--bg-card-solid);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            font-size: 0.95rem;
            line-height: 1.8;
        }
        .weekly-summary strong {
            color: var(--link-color);
        }

        /* ===== 本次报告表格 ===== */
        .report-wrapper {
            overflow-x: auto;
            margin-top: 8px;
        }
        .report-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            border-radius: 12px;
            overflow: hidden;
        }
        .report-wrapper th {
            background: var(--table-header-bg);
            backdrop-filter: blur(8px);
            font-weight: 600;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .report-wrapper td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            transition: background 0.15s ease;
        }
        .report-wrapper tbody tr {
            transition: all 0.2s ease;
        }
        .report-wrapper tbody tr:hover {
            background: var(--glass-bg);
        }
        .report-wrapper a {
            color: var(--link-color);
            text-decoration: none;
        }
        .report-wrapper a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }
        .risk-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .risk-tag.high {
            background: rgba(244, 67, 54, 0.15);
            color: #f43f5e;
        }
        .risk-tag.medium {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        .risk-tag.low {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }
        .risk-cell .short {
            display: inline;
        }
        .risk-cell .full {
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .risk-cell .toggle-link {
            color: var(--link-color);
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 4px;
            text-decoration: none;
            border-bottom: 1px dashed var(--link-color);
        }
        .risk-cell .toggle-link:hover {
            color: var(--link-hover);
        }

        /* ===== 底部折叠历史列表 ===== */
        .history-toggle-area {
            margin-top: 8px;
            padding-top: 16px;
            border-top: 2px dashed var(--border-color);
        }
        .history-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        .history-toggle-btn:hover {
            background: var(--bg-card-solid);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .history-toggle-btn .arrow {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 1.2rem;
        }
        .history-toggle-btn .arrow.open {
            transform: rotate(180deg);
        }
        .history-toggle-btn .badge {
            background: var(--gradient-primary);
            color: white;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .history-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .history-container.open {
            max-height: 5000px;
            opacity: 1;
        }
        .history-wrapper {
            margin-top: 16px;
            overflow-x: auto;
        }
        .history-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            border-radius: 12px;
            overflow: hidden;
        }
        .history-wrapper th {
            background: var(--table-header-bg);
            font-weight: 600;
            padding: 8px 12px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }
        .history-wrapper td {
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }
        .history-wrapper tbody tr:hover {
            background: var(--glass-bg);
        }
        .history-wrapper .date-group {
            background: var(--glass-bg);
            font-weight: 600;
            color: var(--text-secondary);
        }
        .history-wrapper .date-group td {
            padding: 6px 12px;
            border-bottom: 2px solid var(--border-color);
        }
        .history-loading {
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        .history-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* ===== 底部 ===== */
        .footer-bar {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 10px;
        }

        /* ===== 加载 ===== */
        .loader {
            border: 3px solid var(--border-color);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== 登录 ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 17, 33, 0.7);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .login-card {
            background: var(--bg-card-solid);
            padding: 40px 36px;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 340px;
            width: 100%;
            border: 1px solid var(--border-color);
        }
        .login-card h2 {
            margin-bottom: 8px;
            font-size: 1.6rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 40px;
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .login-card input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .login-card .btn {
            width: 100%;
            justify-content: center;
        }
        .error-msg {
            color: #f87171;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 16px;
            }
            .navbar-brand {
                font-size: 1.2rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-number {
                font-size: 1.6rem;
            }
            .charts-row {
                grid-template-columns: 1fr;
            }
            .report-wrapper td,
            .report-wrapper th {
                font-size: 0.7rem;
                padding: 4px 6px;
            }
            .high-risk-summary li {
                font-size: 0.8rem;
            }
            .history-wrapper td,
            .history-wrapper th {
                font-size: 0.7rem;
                padding: 4px 6px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .stat-card {
                padding: 12px;
            }
            .navbar-actions .btn {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== 登录 ===== -->
    <div id="loginOverlay" class="login-overlay" style="display:none;">
        <div class="login-card">
            <h2>🔐 系统登录</h2>
            <p>请输入访问密码</p>
            <input type="password" id="passwordInput" placeholder="请输入密码" autofocus>
            <button id="loginBtn" class="btn btn-primary">确认</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div id="app" style="display:none;">
        <div class="container">

            <!-- 导航 -->
            <div class="card" style="padding:16px 24px;">
                <div class="navbar">
                    <div class="navbar-brand">
                        <span class="logo-icon">🛡️</span>
                        内容安全舆情监控
                        <span class="status-badge"><span class="dot"></span> 运行中</span>
                    </div>
                    <div class="navbar-actions">
                        <span id="report-time-display" style="font-size:0.75rem;color:var(--text-secondary);margin-right:4px;"></span>
                        <button id="refresh-btn" class="btn btn-outline">🔄 刷新</button>
                        <button id="trigger-action-btn" class="btn btn-danger">🚀 更新</button>
                        <button id="history-btn" class="btn btn-success">📚 历史</button>
                        <button id="themeToggleBtn" class="btn btn-outline">🌓 主题</button>
                        <button id="logoutBtn" class="btn btn-outline" style="font-size:0.7rem;">退出</button>
                    </div>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-grid" id="statsGrid" style="display:none;"></div>

            <!-- 图表行 -->
            <div class="charts-row" id="chartsRow" style="display:none;">
                <div class="chart-box">
                    <h3>📊 本次风险分布</h3>

        // ============================================================
        // 4. 工具
        // ============================================================
        function convertUtcToBeijing(utcTimeStr) {
            let cleaned = utcTimeStr.replace(' UTC', '').trim();
            let parts = cleaned.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
            if (!parts) return utcTimeStr;
            let year = parseInt(parts[1]),
                month = parseInt(parts[2]) - 1,
                day = parseInt(parts[3]),
                hour = parseInt(parts[4]),
                minute = parseInt(parts[5]),
                second = parseInt(parts[6]);
            let utcDate = new Date(Date.UTC(year, month, day, hour, minute, second));
            let bj = new Date(utcDate.getTime() + 8 * 3600 * 1000);
            return bj.getUTCFullYear() + '-' +
                String(bj.getUTCMonth() + 1).padStart(2, '0') + '-' +
                String(bj.getUTCDate()).padStart(2, '0') + ' ' +
                String(bj.getUTCHours()).padStart(2, '0') + ':' +
                String(bj.getUTCMinutes()).padStart(2, '0') + ':' +
                String(bj.getUTCSeconds()).padStart(2, '0');
        }

        function extractReportTime(text) {
            const patterns = [
                /生成时间[：:]\s*([^\n]+)/,
                /报告时间[：:]\s*([^\n]+)/,
                /(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s*UTC)/,
            ];
            for (let p of patterns) {
                const m = text.match(p);
                if (m && m[1]) return m[1].trim();
            }
            return null;
        }

        function parseRiskLevel(text) {
            text = text.trim();
            if (/高/.test(text)) return '高';
            if (/中/.test(text)) return '中';
            if (/低/.test(text)) return '低';
            return '未知';
        }

        function formatDate(isoStr) {
            if (!isoStr) return '未知日期';
            const parts = isoStr.match(/(\d{4})-(\d{2})-(\d{2})/);
            if (!parts) return isoStr;
            return parts[1] + '-' + parts[2] + '-' + parts[3];
        }

        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        // ============================================================
        // 5. 解析报告表格（从HTML或文本）
        // ============================================================
        function parseReportTableFromHTML(html) {
            const rows = [];
            const temp = document.createElement('div');
            temp.innerHTML = html;
            const table = temp.querySelector('table');
            if (!table) return rows;
            const tbody = table.querySelector('tbody');
            if (!tbody) return rows;
            const trs = tbody.querySelectorAll('tr');
            trs.forEach(tr => {
                const cells = tr.querySelectorAll('td');
                if (cells.length >= 6) {
                    let eventText = cells[0]?.innerText?.trim() || '';
                    let link = '';
                    const linkEl = cells[0]?.querySelector('a');
                    if (linkEl) {
                        link = linkEl.href;
                        eventText = linkEl.innerText.trim();
                    } else {
                        const linkCell = cells[1];
                        const a = linkCell?.querySelector('a');
                        if (a) link = a.href;
                    }
                    if (!link) {
                        const linkCellText = cells[1]?.innerText?.trim() || '';
                        const match = linkCellText.match(/https?:\/\/[^\s]+/);
                        if (match) link = match[0];
                    }
                    const risk = cells[2]?.innerText?.trim() || '';
                    const source = cells[3]?.innerText?.trim() || '';
                    const timeAgo = cells[4]?.innerText?.trim() || '';
                    const riskLevel = parseRiskLevel(cells[5]?.innerText?.trim() || '');
                    rows.push({ eventText, link, risk, source, timeAgo, riskLevel });
                }
            });
            return rows;
        }

        function parseReportTableFromMarkdown(text) {
            const rows = [];
            const lines = text.split('\n');
            let inTable = false;
            for (let line of lines) {
                if (line.startsWith('|') && line.includes('|')) {
                    if (!inTable) { inTable = true; continue; }
                    if (/^\|[\s\-:]+\|$/.test(line)) continue;
                    const cells = line.split('|').map(c => c.trim()).filter(c => c.length > 0);
                    if (cells.length >= 6) {
                        let eventText = cells[0];
                        let link = '';
                        const linkMatch = cells[1].match(/\[([^\]]*)\]\(([^)]*)\)/);
                        if (linkMatch) {
                            link = linkMatch[2];
                        }
                        const risk = cells[2] || '';
                        const source = cells[3] || '';
                        const timeAgo = cells[4] || '';
                        const riskLevel = parseRiskLevel(cells[5] || '');
                        rows.push({ eventText, link, risk, source, timeAgo, riskLevel });
                    }
                } else {
                    if (inTable) break;
                }
            }
            return rows;
        }

        // ============================================================
        // 8. 加载本周历史事件（从reports/目录）
        // ============================================================
        async function loadHistoryEvents() {
            const badge = document.getElementById('historyBadge');
            const content = document.getElementById('historyContent');

            try {
                // 使用GitHub API获取reports目录文件列表
                const apiUrl =
                    'https://api.github.com/repos/zhetian592/my-crawler-monitor/contents/reports';
                const resp = await fetch(apiUrl);
                if (!resp.ok) throw new Error(`API请求失败: ${resp.status}`);
                const files = await resp.json();

                // 过滤出report_*.html文件
                const reportFiles = files
                    .filter(f => f.name.startsWith('report_') && f.name.endsWith('.html'))
                    .sort((a, b) => b.name.localeCompare(a.name)); // 最新的在前

                if (reportFiles.length === 0) {
                    content.innerHTML = '<div class="history-empty">📭 暂无历史报告</div>';
                    badge.textContent = '0条';
                    historyLoaded = true;
                    return;
                }

                // 取最近7天（最多7个文件）
                const recentFiles = reportFiles.slice(0, 7);
                const allEvents = [];
                const dateMap = {};

                for (const file of recentFiles) {
                    try {
                        const htmlResp = await fetch(file.download_url);
                        if (!htmlResp.ok) continue;
                        const html = await htmlResp.text();

                        // 提取日期：从文件名 report_YYYYMMDD_HHMMSS.html
                        const dateMatch = file.name.match(/report_(\d{4})(\d{2})(\d{2})_/);
                        const dateStr = dateMatch ?
                            `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` :
                            file.name.slice(0, 10);

                        // 解析HTML表格
                        const rows = parseReportTableFromHTML(html);
                        rows.forEach(row => {
                            // 跳过空事件
                            if (!row.eventText || row.eventText.length < 3) return;
                            allEvents.push({
                                ...row,
                                date: dateStr
                            });
                            if (!dateMap[dateStr]) dateMap[dateStr] = [];
                            dateMap[dateStr].push(row);
                        });
                    } catch (e) {
                        console.warn(`加载历史报告 ${file.name} 失败:`, e);
                    }
                }

                historyData = allEvents;
                historyLoaded = true;

                if (allEvents.length === 0) {
                    content.innerHTML = '<div class="history-empty">📭 本周暂无历史数据</div>';
                    badge.textContent = '0条';
                    return;
                }

                badge.textContent = `${allEvents.length}条`;

                // 按日期分组渲染
                const sortedDates = Object.keys(dateMap).sort((a, b) => b.localeCompare(a));
                let html = '<div class="history-wrapper"><table><thead><tr>';
                html += '<th>日期</th><th>事件简述</th><th>风险等级</th><th>信息来源</th><th>原文链接</th>';
                html += '</tr></thead><tbody>';

                for (const date of sortedDates) {
                    const items = dateMap[date];
                    // 日期分组行
                    html += `<tr class="date-group"><td colspan="5">📅 ${date}（${items.length}条）</td></tr>`;
                    items.forEach(item => {
                        const linkHtml = item.link ?
                            `<a href="${item.link}" target="_blank">查看</a>` :
                            '-';
                        const riskClass = item.riskLevel === '高' ? 'high' :
                            item.riskLevel === '中' ? 'medium' : 'low';
                        const riskTag = `<span class="risk-tag ${riskClass}">${item.riskLevel}</span>`;
                        html += `<tr>
                            <td style="white-space:nowrap;">${date}</td>
                            <td>${item.eventText}</td>
                            <td>${riskTag}</td>
                            <td>${item.source || '-'}</td>
                            <td>${linkHtml}</td>
                        </tr>`;
                    });
                }

                html += '</tbody></table></div>';
                content.innerHTML = html;

            } catch (err) {
                console.error('加载历史数据失败:', err);
                content.innerHTML =
                    `<div class="history-empty">⚠️ 加载历史数据失败: ${err.message}<br><button class="btn btn-outline" style="margin-top:12px;" onclick="loadHistoryEvents()">🔄 重试</button></div>`;
                badge.textContent = '加载失败';
                historyLoaded = true;
            }
        }

                const currentHash = simpleHash(text);

                let rawTime = extractReportTime(text);
                let displayTime = rawTime ? convertUtcToBeijing(rawTime) : '未知';
                document.getElementById('report-time-display').textContent = `📅 ${displayTime}（本次抓取）`;

                // 提取周报总结
                let weeklySummaryText = '';
                const lines = text.split('\n');
                let summaryLines = [];
                let inSummary = false;
                for (let line of lines) {
                    if (line.includes('📊 本周舆情综述')) {
                        inSummary = true;
                        summaryLines.push(line.trim());
                    } else if (inSummary && line.trim() && !line.startsWith('|')) {
                        summaryLines.push(line.trim());
                    } else if (inSummary && line.startsWith('|')) {
                        break;
                    }
                }
                if (summaryLines.length > 0) {
                    weeklySummaryText = summaryLines.join(' ');
                    if (!weeklySummaryText.startsWith('📊')) {
                        weeklySummaryText = '📊 本周舆情综述：' + weeklySummaryText;
                    }
                }

                // 解析Markdown
                let html = marked.parse(text);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                tempDiv.querySelectorAll('a').forEach(link => {
                    if (link.href && !link.href.startsWith('#')) {
                        link.setAttribute('target', '_blank');
                        link.setAttribute('rel', 'noopener noreferrer');
                    }
                });

                // 风险点折叠
                const tables = tempDiv.querySelectorAll('table');
                tables.forEach(table => {
                    const rows = table.querySelectorAll('tbody tr');
                    rows.forEach(row => {
                        const cells = row.querySelectorAll('td');
                        if (cells.length >= 6) {
                            const riskCell = cells[2];
                            const fullText = riskCell.innerText.trim();

                                riskCell.className = 'risk-cell';

                                    <span class="short">${shortText}</span>
                                    <span class="full">${fullText}</span>
                                    <a class="toggle-link" onclick="toggleRisk(this)">展开</a>
                                `;
                            }
                        }
                    });
                });

                // 解析数据
                const rows = parseReportTableFromMarkdown(text);
                allReportRows = rows;

                // 事件简述链接化
                tables.forEach(table => {
                    const tbody = table.querySelector('tbody');
                    if (!tbody) return;
                    const trs = tbody.querySelectorAll('tr');
                    trs.forEach((tr, idx) => {
                        const cells = tr.querySelectorAll('td');
                        if (cells.length >= 6 && idx < rows.length) {
                            const rowData = rows[idx];
                            if (rowData && rowData.link) {
                                const eventCell = cells[0];
                                const originalText = eventCell.innerText.trim();
                                eventCell.innerHTML =
                                    `<a href="${rowData.link}" target="_blank" rel="noopener noreferrer">${originalText}</a>`;
                            }
                        }
                    });
                });

                html = tempDiv.innerHTML;
                reportDiv.innerHTML = `<div class="report-wrapper">${html}</div>`;

                // 更新统计、图表等
                updateStatsAndCharts(rows, weeklySummaryText, displayTime);
                await loadTrendData();

                // 预加载历史数据（但默认收起）
                if (!historyLoaded) {
                    // 静默预加载
                    loadHistoryEvents().catch(() => {});
                }

                if (currentHash !== lastReportHash) {
                    if (showAlert) alert('✅ 报告已刷新！');
                    localStorage.setItem('lastReportHash', currentHash);
                    lastReportHash = currentHash;
                }

            } catch (err) {
                reportDiv.innerHTML =
                    `<div style="color:#f87171;background:rgba(244,67,54,0.08);padding:20px;border-radius:16px;">
                    <strong>⚠️ 加载失败</strong><br>${err.message}<br><br>
                    <button class="btn btn-primary" onclick="loadReport(true)">🔄 重试</button>
                </div>`;
                if (showAlert) alert(`❌ 报告刷新失败：${err.message}`);
            }
        }

        // ============================================================
        // 11. GitHub Actions 触发
        // ============================================================
        const REPO_OWNER = 'zhetian592';
        const REPO_NAME = 'my-crawler-monitor';
        const WORKFLOW_ID = 'crawler-tier1.yml';
        const GITHUB_TOKEN_KEY = 'github_pat';

        async function fetchLastRunTime() {
            try {
                const url =
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/runs?per_page=1`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('无法获取工作流运行信息');
                const data = await response.json();
                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const lastRun = data.workflow_runs[0];
                    const createdAt = new Date(lastRun.created_at);
                    const now = new Date();
                    const elapsedSeconds = (now - createdAt) / 1000;
                    const remaining = 3600 - elapsedSeconds;
                    return remaining > 0 ? Math.ceil(remaining) : 0;
                }
                return 0;
            } catch (err) {
                console.warn('获取工作流最后运行时间失败:', err);
                return 0;
            }
        }

        async function updateButtonState() {
            const btn = document.getElementById('trigger-action-btn');
            const remaining = await fetchLastRunTime();
            if (remaining > 0) {
                btn.disabled = true;
                btn.textContent = `⏳ 等待 ${Math.floor(remaining/60)}分${remaining%60}秒`;
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(async () => {
                    const newRemaining = await fetchLastRunTime();
                    if (newRemaining <= 0) {
                        btn.disabled = false;
                        btn.textContent = '🚀 更新';
                        if (countdownInterval) clearInterval(countdownInterval);
                    } else {
                        btn.textContent = `⏳ 等待 ${Math.floor(newRemaining/60)}分${newRemaining%60}秒`;
                    }
                }, 1000);
            } else {
                btn.disabled = false;
                btn.textContent = '🚀 更新';
                if (countdownInterval) clearInterval(countdownInterval);
            }
        }

        async function triggerWorkflow() {
            const remaining = await fetchLastRunTime();
            if (remaining > 0) {
                alert(`请等待 ${Math.floor(remaining/60)}分${remaining%60}秒后再试。`);
                return;
            }
            let token = localStorage.getItem(GITHUB_TOKEN_KEY);
            if (!token) {
                token = prompt('请填写你的 GitHub Personal Access Token (需要 repo 权限)：\n生成地址：https://github.com/settings/tokens\n令牌将保存在本地。');
                if (!token) return;
                localStorage.setItem(GITHUB_TOKEN_KEY, token);
            }
            const btn = document.getElementById('trigger-action-btn');
            const originalText = btn.innerText;
            btn.innerText = '⏳ 触发中...';
            btn.disabled = true;
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ ref: 'main' })
                    });
                if (response.ok) {
                    alert('✅ 已触发爬虫任务！\n稍等几分钟后点击"刷新"查看结果。');
                    await updateButtonState();
                } else {
                    const error = await response.json();
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem(GITHUB_TOKEN_KEY);
                        alert('令牌无效或已过期，请重新输入。');
                    } else {
                        alert(`❌ 触发失败 (${response.status}): ${error.message || '未知错误'}`);
                    }
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            } catch (err) {
                alert(`网络错误：${err.message}`);
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        // ============================================================
        // 12. 历史报告
        // ============================================================
        async function openHistory() {
            const btn = document.getElementById('history-btn');
            const originalText = btn.innerText;
            btn.innerText = '⏳ 检查中...';
            btn.disabled = true;
            try {
                const response = await fetch(
                    'https://raw.githubusercontent.com/zhetian592/my-crawler-monitor/main/reports/index.html');
                if (response.ok) {
                    window.open('reports/index.html', '_blank');
                } else {
                    alert('历史报告目录尚未生成。请先运行爬虫任务。');
                }
            } catch (err) {
                alert('无法访问历史报告目录。');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // ============================================================
        // 13. Token 提示
        // ============================================================
        function promptTokenIfNeeded() {
            if (!localStorage.getItem(GITHUB_TOKEN_KEY)) {
                setTimeout(() => {
                    if (!localStorage.getItem(GITHUB_TOKEN_KEY)) {
                        let token = prompt('为提高体验，请填写你的 GitHub Personal Access Token（只需一次）。\n生成地址：https://github.com/settings/tokens（需 repo 权限）\n令牌保存在本地，不会上传。', '');
                        if (token) {
                            localStorage.setItem(GITHUB_TOKEN_KEY, token);
                            alert('✅ 令牌已保存，可使用"立即更新"按钮。');
                        }
                    }
                }, 2000);
            }
        }

        // ============================================================
        // 14. 初始化
        // ============================================================
        function initApp() {
            applyTheme();
            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
            document.getElementById('logoutBtn').addEventListener('click', () => {
                sessionStorage.removeItem(SESSION_KEY);
                location.reload();
            });
            document.getElementById('refresh-btn').addEventListener('click', () => loadReport(true));
            document.getElementById('trigger-action-btn').addEventListener('click', triggerWorkflow);
            document.getElementById('history-btn').addEventListener('click', openHistory);

            loadReport(false);
            updateButtonState();
            promptTokenIfNeeded();

            // 如果用户之前打开了历史列表，刷新后保持状态（但默认关闭）
            // 无额外操作
        }

        // 暴露函数给全局
        window.loadReport = loadReport;
        window.loadHistoryEvents = loadHistoryEvents;

        checkLogin();
    </script>
</body>
</html>

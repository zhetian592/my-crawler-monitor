<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🛡️ 内容安全舆情监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        /* ========== CSS 变量 & 重置 ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== 深色主题（默认） ===== */
        :root,
        [data-theme="dark"] {
            --bg-body: #0b1121;
            --bg-card: rgba(26, 35, 50, 0.30);
            --bg-card-solid: rgba(26, 35, 50, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #d0d8e0;
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.7);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-bg: rgba(26, 35, 50, 0.30);
            --table-header-bg: rgba(30, 41, 59, 0.5);
            --table-hover-bg: rgba(30, 41, 59, 0.3);
            --table-bg: rgba(26, 35, 50, 0.40);
            --table-blur: blur(12px);
            --link-color: #6ea8fe;
            --link-hover: #9ec8ff;
            --gradient-primary: linear-gradient(135deg, #38bdf8, #818cf8);
            --gradient-danger: linear-gradient(135deg, #f87171, #f43f5e);
            --gradient-warning: linear-gradient(135deg, #fbbf24, #f59e0b);
            --gradient-success: linear-gradient(135deg, #34d399, #60a5fa);
            --risk-high: #f43f5e;
            --risk-medium: #f59e0b;
            --risk-low: #34d399;
            --tooltip-bg: rgba(26, 35, 50, 0.96);
            --tooltip-text: #f0f4f8;
            --tooltip-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --tooltip-border: rgba(255, 255, 255, 0.1);
            --theme-label: '🌙 深色';
            --accent-glow: rgba(56, 189, 248, 0.06);
            --accent-glow2: rgba(244, 114, 182, 0.04);
            --stat-number-bg: linear-gradient(135deg, #38bdf8, #818cf8);
        }

        /* ===== 青色主题 ===== */
        [data-theme="cyan"] {
            --bg-body: #0c1824;
            --bg-card: rgba(15, 30, 50, 0.30);
            --bg-card-solid: rgba(15, 30, 50, 0.85);
            --text-primary: #e6f7ff;
            --text-secondary: #b0d4e8;
            --border-color: rgba(0, 255, 255, 0.10);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 12px 48px rgba(0, 200, 255, 0.08);
            --glass-border: rgba(0, 255, 255, 0.08);
            --glass-bg: rgba(0, 200, 255, 0.06);
            --table-header-bg: rgba(0, 200, 255, 0.08);
            --table-hover-bg: rgba(0, 200, 255, 0.05);
            --table-bg: rgba(0, 40, 60, 0.40);
            --table-blur: blur(12px);
            --link-color: #22d3ee;
            --link-hover: #67e8f9;
            --gradient-primary: linear-gradient(135deg, #06b6d4, #3b82f6);
            --gradient-danger: linear-gradient(135deg, #f87171, #f43f5e);
            --gradient-warning: linear-gradient(135deg, #fbbf24, #f59e0b);
            --gradient-success: linear-gradient(135deg, #34d399, #06b6d4);
            --risk-high: #f43f5e;
            --risk-medium: #f59e0b;
            --risk-low: #22d3ee;
            --tooltip-bg: rgba(0, 30, 50, 0.96);
            --tooltip-text: #e6f7ff;
            --tooltip-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --tooltip-border: rgba(0, 255, 255, 0.1);
            --theme-label: '💠 青色';
            --accent-glow: rgba(0, 255, 255, 0.06);
            --accent-glow2: rgba(56, 189, 248, 0.04);
            --stat-number-bg: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        /* ===== 橙色主题 ===== */
        [data-theme="orange"] {
            --bg-body: #1a0e08;
            --bg-card: rgba(40, 20, 10, 0.30);
            --bg-card-solid: rgba(40, 20, 10, 0.85);
            --text-primary: #fff5ed;
            --text-secondary: #e8d5c8;
            --border-color: rgba(255, 150, 50, 0.10);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 12px 48px rgba(255, 150, 50, 0.08);
            --glass-border: rgba(255, 150, 50, 0.08);
            --glass-bg: rgba(255, 150, 50, 0.06);
            --table-header-bg: rgba(255, 150, 50, 0.08);
            --table-hover-bg: rgba(255, 150, 50, 0.05);
            --table-bg: rgba(50, 25, 10, 0.40);
            --table-blur: blur(12px);
            --link-color: #fb923c;
            --link-hover: #fdba74;
            --gradient-primary: linear-gradient(135deg, #f97316, #f43f5e);
            --gradient-danger: linear-gradient(135deg, #f87171, #dc2626);
            --gradient-warning: linear-gradient(135deg, #fbbf24, #f97316);
            --gradient-success: linear-gradient(135deg, #34d399, #f97316);
            --risk-high: #f43f5e;
            --risk-medium: #f97316;
            --risk-low: #fb923c;
            --tooltip-bg: rgba(40, 20, 10, 0.96);
            --tooltip-text: #fff5ed;
            --tooltip-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --tooltip-border: rgba(255, 150, 50, 0.1);
            --theme-label: '🔥 橙色';
            --accent-glow: rgba(255, 150, 50, 0.06);
            --accent-glow2: rgba(244, 114, 182, 0.04);
            --stat-number-bg: linear-gradient(135deg, #f97316, #f43f5e);
        }

        body {
            background-image: url('clipboard-image-1783081059.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0b1121;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            position: relative;
            text-shadow: 0 1px 8px rgba(255, 255, 255, 0.08), 0 0 30px rgba(0, 0, 0, 0.12);
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, var(--accent-glow2) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card-solid {
            background: var(--bg-card-solid);
            backdrop-filter: none;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .card-solid:hover {
            box-shadow: var(--shadow-hover);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 12px 0 4px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }
        .navbar-brand .logo-icon {
            font-size: 2rem;
            -webkit-text-fill-color: initial;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--glass-bg);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            -webkit-text-fill-color: var(--text-secondary);
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            user-select: none;
            text-shadow: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border-color: var(--link-color);
        }
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 28px var(--link-color);
        }
        .btn-danger {
            background: var(--gradient-danger);
            color: white;
            border: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .btn-danger:hover {
            box-shadow: 0 8px 28px rgba(244, 67, 54, 0.35);
        }
        .btn-success {
            background: var(--gradient-success);
            color: white;
            border: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .btn-success:hover {
            box-shadow: 0 8px 28px rgba(52, 211, 153, 0.35);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: var(--glass-bg);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--stat-number-bg);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            text-shadow: none;
        }
        .stat-number.danger {
            background: var(--gradient-danger);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.warning {
            background: var(--gradient-warning);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.success {
            background: var(--gradient-success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.info {
            background: var(--stat-number-bg);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }

        .high-risk-summary {
            background: var(--bg-card-solid);
            border-radius: 16px;
            padding: 16px 20px;
            border-left: 4px solid #f43f5e;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .high-risk-summary h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .high-risk-summary ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .high-risk-summary li {
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .high-risk-summary li:last-child {
            border-bottom: none;
        }
        .high-risk-summary .risk-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }
        .high-risk-summary .risk-link:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }
        .high-risk-summary .source-tag {
            font-size: 0.7rem;
            background: var(--glass-bg);
            padding: 2px 10px;
            border-radius: 20px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .high-risk-summary .new-badge {
            font-size: 0.6rem;
            background: rgba(56, 189, 248, 0.2);
            color: var(--link-color);
            padding: 1px 8px;
            border-radius: 20px;
            margin-right: 6px;
        }

        .report-wrapper {
            overflow-x: auto;
            margin-top: 8px;
            background: var(--table-bg);
            backdrop-filter: var(--table-blur);
            -webkit-backdrop-filter: var(--table-blur);
            border-radius: 12px;
            padding: 4px 0;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }
        .report-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            border-radius: 12px;
            overflow: hidden;
        }
        .report-wrapper th {
            background: var(--table-header-bg);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }
        .report-wrapper td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            transition: background 0.15s ease;
        }
        .report-wrapper tbody tr:hover {
            background: var(--table-hover-bg);
        }
        .report-wrapper a {
            color: var(--link-color);
            text-decoration: none;
        }
        .report-wrapper a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        .risk-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .risk-tag.high {
            background: rgba(244, 67, 54, 0.15);
            color: #f43f5e;
            box-shadow: 0 0 12px rgba(244, 67, 54, 0.08);
        }
        .risk-tag.medium {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.08);
        }
        .risk-tag.low {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.08);
        }

        .risk-cell {
            position: relative;
            display: inline-block;
            max-width: 100%;
            cursor: pointer;
        }
        .risk-cell .risk-text {
            display: inline;
            border-bottom: 1.5px dashed var(--border-color);
            padding-bottom: 1px;
            transition: border-color 0.2s;
        }
        .risk-cell:hover .risk-text {
            border-color: var(--link-color);
        }
        .risk-cell .ellipsis {
            color: var(--text-secondary);
            font-weight: 600;
        }
        .risk-cell .expand-btn {
            color: var(--link-color);
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: 4px;
            text-decoration: none;
            border-bottom: 1px dashed var(--link-color);
            display: inline-block;
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
        }
        .risk-cell .expand-btn:hover {
            color: var(--link-hover);
        }

        .risk-tooltip {
            position: fixed;
            max-width: 460px;
            min-width: 220px;
            padding: 14px 18px;
            background: var(--tooltip-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--tooltip-border);
            border-radius: 14px;
            box-shadow: var(--tooltip-shadow);
            color: var(--tooltip-text);
            font-size: 0.85rem;
            line-height: 1.7;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
            transform: translateY(-8px) scale(0.96);
            pointer-events: none;
            word-break: break-word;
            white-space: pre-wrap;
            text-shadow: none;
        }
        .risk-tooltip.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .risk-tooltip::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 24px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--tooltip-bg);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.06));
        }
        .risk-tooltip.arrow-top::after {
            bottom: auto;
            top: -8px;
            border-top: none;
            border-bottom: 8px solid var(--tooltip-bg);
        }
        .risk-tooltip .tooltip-label {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 4px;
            opacity: 0.7;
        }
        .risk-tooltip .tooltip-risk-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 30px;
            margin-left: 8px;
            text-transform: uppercase;
        }
        .risk-tooltip .tooltip-risk-badge.high { background: rgba(244,67,54,0.15); color: #f43f5e; }
        .risk-tooltip .tooltip-risk-badge.medium { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .risk-tooltip .tooltip-risk-badge.low { background: rgba(52,211,153,0.15); color: #34d399; }

        .footer-bar {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 10px; }

        .loader {
            border: 3px solid var(--border-color);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11,17,33,0.7);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .login-card {
            background: var(--bg-card-solid);
            padding: 40px 36px;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 340px;
            width: 100%;
            border: 1px solid var(--border-color);
        }
        .login-card h2 {
            margin-bottom: 8px;
            font-size: 1.6rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-card p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; }
        .login-card input {
            width: 100%; padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 40px;
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .login-card input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
        .login-card .btn { width: 100%; justify-content: center; }
        .error-msg { color: #f87171; margin-top: 12px; font-size: 0.85rem; }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .card { padding: 16px; }
            .navbar-brand { font-size: 1.2rem; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .stat-number { font-size: 1.6rem; }
            .report-wrapper td, .report-wrapper th { font-size: 0.75rem; padding: 6px 8px; }
            .high-risk-summary li { font-size: 0.8rem; }
            .risk-tooltip { max-width: 300px; padding: 12px 14px; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
            .stat-card { padding: 10px 8px; }
            .stat-number { font-size: 1.3rem; }
            .stat-label { font-size: 0.6rem; }
            .navbar-actions .btn { font-size: 0.65rem; padding: 4px 10px; }
            .risk-tooltip { max-width: 260px; padding: 10px 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div id="loginOverlay" class="login-overlay" style="display:none;">
        <div class="login-card">
            <h2>🔐 系统登录</h2>
            <p>请输入访问密码</p>
            <input type="password" id="passwordInput" placeholder="请输入密码" autofocus>
            <button id="loginBtn" class="btn btn-primary">确认</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <div id="app" style="display:none;">
        <div class="container">
            <div class="card" style="padding: 16px 24px;">
                <div class="navbar">
                    <div class="navbar-brand">
                        <span class="logo-icon">🛡️</span>
                        内容安全舆情监控
                        <span class="status-badge"><span class="dot"></span> 运行中</span>
                    </div>
                    <div class="navbar-actions">
                        <span id="report-time-display" style="font-size:0.8rem; color:var(--text-secondary); margin-right:4px;"></span>
                        <button id="refresh-btn" class="btn btn-outline">🔄 刷新</button>
                        <button id="trigger-action-btn" class="btn btn-danger">🚀 立即更新</button>
                        <button id="history-btn" class="btn btn-success">📚 历史</button>
                        <button id="themeToggleBtn" class="btn btn-outline">🌙 深色</button>
                        <button id="logoutBtn" class="btn btn-outline" style="font-size:0.75rem;">退出</button>
                    </div>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid" style="display:none;"></div>
            <div id="highRiskSummary" class="high-risk-summary" style="display:none;">
                <h3>⚠️ 高风险事件 TOP 5</h3>
                <ul id="highRiskList"></ul>
            </div>
            <div class="card">
                <div id="report-content"><div class="loader"></div></div>
            </div>
            <div class="footer-bar">
                <span>⚡ 数据来自定期爬取 | 自动生成涉华负面报告</span>
                <span id="trigger-limit-info"></span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 登录
        // ============================================================
        const PASSWORD = 'dzx12123';
        const SESSION_KEY = 'logged_in';

        function checkLogin() {
            if (sessionStorage.getItem(SESSION_KEY) === 'true') {
                document.getElementById('app').style.display = 'block';
                document.getElementById('loginOverlay').style.display = 'none';
                initApp();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                const input = document.getElementById('passwordInput');
                const btn = document.getElementById('loginBtn');
                const errorDiv = document.getElementById('loginError');
                const doLogin = () => {
                    if (input.value === PASSWORD) {
                        sessionStorage.setItem(SESSION_KEY, 'true');
                        document.getElementById('loginOverlay').style.display = 'none';
                        document.getElementById('app').style.display = 'block';
                        initApp();
                    } else {
                        errorDiv.textContent = '密码错误，请重试。';
                        input.value = '';
                        input.focus();
                    }
                };
                btn.onclick = doLogin;
                input.onkeypress = (e) => { if (e.key === 'Enter') doLogin(); };
                input.focus();
            }
        }

        // ============================================================
        // 2. 初始化
        // ============================================================
        const THEMES = ['dark', 'cyan', 'orange'];
        const THEME_LABELS = {
            dark: '🌙 深色',
            cyan: '💠 青色',
            orange: '🔥 橙色'
        };
        let currentTheme = localStorage.getItem('theme') || 'dark';
        let countdownInterval = null;
        let activeTooltip = null;

        function initApp() {
            applyTheme();
            document.getElementById('themeToggleBtn').addEventListener('click', cycleTheme);
            document.getElementById('logoutBtn').addEventListener('click', () => {
                sessionStorage.removeItem(SESSION_KEY);
                location.reload();
            });
            document.getElementById('refresh-btn').addEventListener('click', () => loadReport(true));
            document.getElementById('trigger-action-btn').addEventListener('click', triggerWorkflow);
            document.getElementById('history-btn').addEventListener('click', openHistory);
            loadReport(false);
            updateButtonState();
            promptTokenIfNeeded();
        }

        function applyTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.textContent = THEME_LABELS[currentTheme] || '🌙 深色';
        }

        function cycleTheme() {
            const currentIndex = THEMES.indexOf(currentTheme);
            const nextIndex = (currentIndex + 1) % THEMES.length;
            currentTheme = THEMES[nextIndex];
            applyTheme();
        }

        // ============================================================
        // 3. 工具函数
        // ============================================================
        function convertUtcToBeijing(utcTimeStr) {
            let cleaned = utcTimeStr.replace(' UTC', '').trim();
            let parts = cleaned.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
            if (!parts) return utcTimeStr;
            let year = parseInt(parts[1]), month = parseInt(parts[2])-1, day = parseInt(parts[3]);
            let hour = parseInt(parts[4]), minute = parseInt(parts[5]), second = parseInt(parts[6]);
            let utcDate = new Date(Date.UTC(year, month, day, hour, minute, second));
            let bj = new Date(utcDate.getTime() + 8 * 3600 * 1000);
            return bj.getUTCFullYear() + '-' +
                String(bj.getUTCMonth()+1).padStart(2,'0') + '-' +
                String(bj.getUTCDate()).padStart(2,'0') + ' ' +
                String(bj.getUTCHours()).padStart(2,'0') + ':' +
                String(bj.getUTCMinutes()).padStart(2,'0') + ':' +
                String(bj.getUTCSeconds()).padStart(2,'0');
        }

        function extractReportTime(text) {
            const patterns = [
                /生成时间[：:]\s*([^\n]+)/,
                /报告时间[：:]\s*([^\n]+)/,
                /(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s*UTC)/,
            ];
            for (let p of patterns) {
                const m = text.match(p);
                if (m && m[1]) return m[1].trim();
            }
            return null;
        }

        function extractFetchCount(text) {
            const m = text.match(/抓取数据[：:]\s*(\d+)\s*条/);
            return m ? parseInt(m[1], 10) : 0;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 4. 解析表格
        // ============================================================
        function parseReportTableFromMarkdown(text) {
            const rows = [];
            const lines = text.split('\n');
            let inTable = false;
            for (let line of lines) {
                if (line.startsWith('|') && line.includes('|')) {
                    if (!inTable) { inTable = true; continue; }
                    if (/^\|[\s\-:]+\|$/.test(line)) continue;
                    const cells = line.split('|').map(c => c.trim()).filter(c => c.length > 0);
                    if (cells.length >= 6) {
                        let eventText = cells[0];
                        let link = '';
                        const lm = cells[1].match(/\[([^\]]*)\]\(([^)]*)\)/);
                        if (lm) link = lm[2];
                        const risk = cells[2] || '';
                        const source = cells[3] || '';
                        const timeAgo = cells[4] || '';
                        let riskLevel = cells[5] || '';
                        if (riskLevel.includes('高')) riskLevel = '高';
                        else if (riskLevel.includes('中')) riskLevel = '中';
                        else if (riskLevel.includes('低')) riskLevel = '低';
                        else riskLevel = '未知';
                        const isNew = eventText.includes('🆕');
                        rows.push({ eventText, link, risk, source, timeAgo, riskLevel, isNew });
                    }
                } else {
                    if (inTable) break;
                }
            }
            return rows;
        }

        function sortRows(rows) {
            const getPriority = (row) => {
                const isNew = row.isNew || row.eventText.includes('🆕');
                const level = row.riskLevel;
                if (isNew && level === '高') return 1;
                if (isNew && level === '中') return 2;
                if (isNew && level === '低') return 3;
                if (!isNew && level === '高') return 4;
                if (!isNew && level === '中') return 5;
                if (!isNew && level === '低') return 6;
                return 7;
            };
            return [...rows].sort((a, b) => getPriority(a) - getPriority(b));
        }

        function updateStatsAndHighRisk(rows, fetchCount) {
            const statsGrid = document.getElementById('statsGrid');
            const highRiskSummary = document.getElementById('highRiskSummary');
            const highRiskList = document.getElementById('highRiskList');
            if (!rows || rows.length === 0) {
                statsGrid.style.display = 'none';
                highRiskSummary.style.display = 'none';
                return;
            }
            const sorted = sortRows(rows);
            const total = sorted.length;
            const high = sorted.filter(r => r.riskLevel === '高').length;
            const medium = sorted.filter(r => r.riskLevel === '中').length;
            const low = sorted.filter(r => r.riskLevel === '低').length;
            const newCount = sorted.filter(r => r.isNew || r.eventText.includes('🆕')).length;
            const displayFetch = fetchCount > 0 ? fetchCount : 0;
            statsGrid.style.display = 'grid';
            statsGrid.innerHTML = `
                <div class="stat-card"><div class="stat-number info">${displayFetch}</div><div class="stat-label">📥 抓取数据</div></div>
                <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">🎯 AI筛选总涉华事件</div></div>
                <div class="stat-card"><div class="stat-number danger">${high}</div><div class="stat-label">🔴 高风险</div></div>
                <div class="stat-card"><div class="stat-number warning">${medium}</div><div class="stat-label">🟠 中风险</div></div>
                <div class="stat-card"><div class="stat-number success">${low}</div><div class="stat-label">🟢 低风险</div></div>
                <div class="stat-card"><div class="stat-number">${newCount}</div><div class="stat-label">🆕 新增</div></div>
            `;
            const highItems = sorted.filter(r => r.riskLevel === '高').slice(0, 5);
            if (highItems.length > 0) {
                highRiskSummary.style.display = 'block';
                highRiskList.innerHTML = highItems.map(item => {
                    const isNew = item.isNew || item.eventText.includes('🆕');
                    const displayText = item.eventText.replace('🆕', '').trim();
                    const badge = isNew ? '<span class="new-badge">🆕</span>' : '';
                    return `<li>
                        ${item.link ? `<a href="${item.link}" target="_blank" class="risk-link">${badge}${escapeHtml(displayText)}</a>` : `<span>${badge}${escapeHtml(displayText)}</span>`}
                        <span class="source-tag">${escapeHtml(item.source)}</span>
                    </li>`;
                }).join('');
            } else {
                highRiskSummary.style.display = 'none';
            }
        }

        // ============================================================
        // 5. Tooltip
        // ============================================================
        let tooltipInstance = null;
        function createTooltip() {
            if (tooltipInstance) return tooltipInstance;
            const el = document.createElement('div');
            el.className = 'risk-tooltip';
            el.innerHTML = `<div class="tooltip-label">📌 风险分析</div><div class="tooltip-body"></div><button class="tooltip-close">收起</button>`;
            document.body.appendChild(el);
            tooltipInstance = el;
            el.querySelector('.tooltip-close').addEventListener('click', (e) => { e.stopPropagation(); hideTooltipImmediately(); });
            return el;
        }

        function showTooltip(sourceEl, text, riskLevel) {
            if (!text) return;
            const tooltip = createTooltip();
            const lc = riskLevel === '高' ? 'high' : riskLevel === '中' ? 'medium' : 'low';
            tooltip.querySelector('.tooltip-body').innerHTML = `${escapeHtml(text)} <span class="tooltip-risk-badge ${lc}">${escapeHtml(riskLevel)}</span>`;
            const rect = sourceEl.getBoundingClientRect();
            const tw = Math.min(460, window.innerWidth - 40);
            let left = rect.left + rect.width/2 - tw/2;
            let top = rect.top - (tooltip.offsetHeight || 200) - 14;
            if (left < 20) left = 20;
            if (left + tw > window.innerWidth - 20) left = window.innerWidth - tw - 20;
            if (top < 20) {
                top = rect.bottom + 14;
                tooltip.classList.add('arrow-top');
            } else {
                tooltip.classList.remove('arrow-top');
            }
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            tooltip.style.maxWidth = tw + 'px';
            tooltip.classList.add('visible');
            tooltip._source = sourceEl;
            activeTooltip = tooltip;
        }

        function hideTooltipImmediately() {
            if (tooltipInstance) {
                tooltipInstance.classList.remove('visible');
                tooltipInstance._source = null;
                activeTooltip = null;
            }
        }

        document.addEventListener('click', (e) => {
            if (activeTooltip && !e.target.closest('.risk-cell') && !e.target.closest('.risk-tooltip')) {
                hideTooltipImmediately();
            }
        });

        // ============================================================
        // 6. 加载报告
        // ============================================================
        let lastReportHash = localStorage.getItem('lastReportHash') || '';
        function simpleHash(text) { return text.slice(0, 200) + text.length; }

        async function loadReport(showAlert) {
            const reportDiv = document.getElementById('report-content');
            reportDiv.innerHTML = '<div class="loader"></div>';
            hideTooltipImmediately();
            try {
                const resp = await fetch('https://raw.githubusercontent.com/zhetian592/my-crawler-monitor/main/report.md');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                const hash = simpleHash(text);
                const rawTime = extractReportTime(text);
                const displayTime = rawTime ? convertUtcToBeijing(rawTime) : '未知';
                document.getElementById('report-time-display').textContent = `📅 ${displayTime}`;
                const fetchCount = extractFetchCount(text);
                const tableStart = text.indexOf('| 事件简述');
                const tableText = tableStart > 0 ? text.substring(tableStart) : text;
                let html = marked.parse(tableText);
                const temp = document.createElement('div');
                temp.innerHTML = html;
                temp.querySelectorAll('a').forEach(link => {
                    if (link.href && !link.href.startsWith('#')) {
                        link.setAttribute('target', '_blank');
                        link.setAttribute('rel', 'noopener noreferrer');
                    }
                });
                const rawRows = parseReportTableFromMarkdown(tableText);
                const sortedRows = sortRows(rawRows);
                const tables = temp.querySelectorAll('table');
                tables.forEach(table => {
                    const thead = table.querySelector('thead');
                    const tbody = table.querySelector('tbody');
                    if (!thead || !tbody) return;
                    tbody.innerHTML = '';
                    sortedRows.forEach(row => {
                        const tr = document.createElement('tr');
                        const td1 = document.createElement('td');
                        const displayText = row.eventText.replace('🆕', '').trim();
                        const isNew = row.isNew || row.eventText.includes('🆕');
                        const newPrefix = isNew ? '🆕 ' : '';
                        if (row.link) td1.innerHTML = `<a href="${escapeHtml(row.link)}" target="_blank">${newPrefix}${escapeHtml(displayText)}</a>`;
                        else td1.textContent = newPrefix + displayText;
                        tr.appendChild(td1);
                        const td2 = document.createElement('td');
                        td2.innerHTML = row.link ? `<a href="${escapeHtml(row.link)}" target="_blank">查看</a>` : '-';
                        tr.appendChild(td2);
                        const td3 = document.createElement('td');
                        const fullRisk = row.risk || '';
                        if (fullRisk.length > 10) {
                            const wrapper = document.createElement('span');
                            wrapper.className = 'risk-cell';
                            wrapper.dataset.fullText = fullRisk;
                            wrapper.dataset.riskLevel = row.riskLevel;
                            const textSpan = document.createElement('span');
                            textSpan.className = 'risk-text';
                            textSpan.textContent = fullRisk.substring(0, 10);
                            wrapper.appendChild(textSpan);
                            const ellipsis = document.createElement('span');
                            ellipsis.className = 'ellipsis';
                            ellipsis.textContent = '...';
                            wrapper.appendChild(ellipsis);
                            const btn = document.createElement('button');
                            btn.className = 'expand-btn';
                            btn.textContent = '展开';
                            btn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                if (activeTooltip && activeTooltip._source === wrapper) {
                                    hideTooltipImmediately();
                                    return;
                                }
                                showTooltip(wrapper, wrapper.dataset.fullText, wrapper.dataset.riskLevel);
                            });
                            wrapper.appendChild(btn);
                            td3.appendChild(wrapper);
                        } else {
                            td3.textContent = fullRisk;
                        }
                        tr.appendChild(td3);
                        const td4 = document.createElement('td');
                        td4.textContent = row.source || '-';
                        tr.appendChild(td4);
                        const td5 = document.createElement('td');
                        td5.textContent = row.timeAgo || '-';
                        tr.appendChild(td5);
                        const td6 = document.createElement('td');
                        const lc = row.riskLevel === '高' ? 'high' : row.riskLevel === '中' ? 'medium' : 'low';
                        td6.innerHTML = `<span class="risk-tag ${lc}">${row.riskLevel}</span>`;
                        tr.appendChild(td6);
                        tbody.appendChild(tr);
                    });
                });
                html = temp.innerHTML;
                reportDiv.innerHTML = `<div class="report-wrapper">${html}</div>`;
                updateStatsAndHighRisk(sortedRows, fetchCount);
                if (hash !== lastReportHash) {
                    if (showAlert) alert('✅ 报告已刷新！');
                    localStorage.setItem('lastReportHash', hash);
                    lastReportHash = hash;
                }
            } catch (err) {
                reportDiv.innerHTML = `<div style="color:#f87171;background:rgba(244,67,54,0.08);padding:20px;border-radius:16px;">
                    <strong>⚠️ 加载失败</strong><br>${escapeHtml(err.message)}<br><br>
                    <button class="btn btn-primary" onclick="loadReport(true)">🔄 重试</button>
                </div>`;
                if (showAlert) alert(`❌ 报告刷新失败：${err.message}`);
            }
        }

        // ============================================================
        // 7. GitHub Actions 状态检测（带 Token 防限流）
        // ============================================================
        const REPO_OWNER = 'zhetian592';
        const REPO_NAME = 'my-crawler-monitor';
        const WORKFLOW_ID = 'crawler-tier1.yml';
        const GITHUB_TOKEN_KEY = 'github_pat';

        async function updateButtonState() {
            const btn = document.getElementById('trigger-action-btn');
            const info = document.getElementById('trigger-limit-info');
            try {
                // 构建请求头（有 token 则携带，大幅提升调用配额）
                const headers = {};
                const token = localStorage.getItem(GITHUB_TOKEN_KEY);
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/runs?per_page=3`;
                const resp = await fetch(url, { headers });
                if (!resp.ok) throw new Error('无法获取状态');
                const data = await resp.json();
                const runs = data.workflow_runs || [];

                // 先检查是否有活跃任务
                const active = runs.find(r => r.status === 'in_progress' || r.status === 'queued');
                if (active) {
                    btn.disabled = true;
                    if (active.status === 'in_progress') {
                        btn.textContent = '🔄 运行中...';
                        if (info) info.textContent = '当前有任务正在执行，请等待完成';
                    } else {
                        btn.textContent = '⏳ 排队中...';
                        if (info) info.textContent = '任务已排队，等待上一个完成后自动执行';
                    }
                    if (countdownInterval) clearInterval(countdownInterval);
                    countdownInterval = setInterval(updateButtonState, 10000);
                    return;
                }

                // 无活跃任务，检查1小时冷却
                const lastRun = runs[0];
                if (lastRun) {
                    const createdAt = new Date(lastRun.created_at);
                    const now = new Date();
                    const elapsed = (now - createdAt) / 1000;
                    const cooldown = 3600;
                    const remaining = cooldown - elapsed;
                    if (remaining > 0) {
                        btn.disabled = true;
                        const mins = Math.floor(remaining / 60);
                        const secs = Math.floor(remaining % 60);
                        btn.textContent = `⏳ 冷却 ${mins}分${secs}秒`;
                        if (info) info.textContent = '每小时限触发一次';
                        if (countdownInterval) clearInterval(countdownInterval);
                        countdownInterval = setInterval(updateButtonState, 1000);
                        return;
                    }
                }

                // 一切正常，可以触发
                btn.disabled = false;
                btn.textContent = '🚀 立即更新';
                if (info) info.textContent = '可以触发新的爬虫任务';
                if (countdownInterval) clearInterval(countdownInterval);

            } catch (err) {
                // 接口异常时放开按钮，并清理定时器
                btn.disabled = false;
                btn.textContent = '🚀 立即更新';
                if (info) info.textContent = '状态检查失败，仍可尝试触发';
                if (countdownInterval) clearInterval(countdownInterval);
            }
        }

        // ============================================================
        // 8. 触发工作流（加入状态锁，防止绕过冷却）
        // ============================================================
        async function triggerWorkflow() {
            const btn = document.getElementById('trigger-action-btn');
            
            // 触发前先同步最新状态，若按钮被禁用则直接返回
            await updateButtonState();
            if (btn.disabled) {
                // updateButtonState 内已经设置了提示文字，这里只做二次保险
                return;
            }

            let token = localStorage.getItem(GITHUB_TOKEN_KEY);
            if (!token) {
                token = prompt('请填写你的 GitHub Personal Access Token (需要 repo 权限)：\n生成地址：https://github.com/settings/tokens\n令牌将保存在本地。');
                if (!token) return;
                localStorage.setItem(GITHUB_TOKEN_KEY, token);
            }

            const originalText = btn.innerText;
            btn.innerText = '⏳ 触发中...';
            btn.disabled = true;
            try {
                const resp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ref: 'main' })
                });
                if (resp.ok) {
                    alert('✅ 已触发爬虫任务！稍等几分钟后点击"刷新"查看结果。');
                    await updateButtonState();  // 立即切换为“运行中”或“排队中”
                } else {
                    const error = await resp.json();
                    if (resp.status === 401 || resp.status === 403) {
                        localStorage.removeItem(GITHUB_TOKEN_KEY);
                        alert('令牌无效或已过期，请重新输入。');
                    } else {
                        alert(`❌ 触发失败 (${resp.status}): ${error.message || '未知错误'}`);
                    }
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            } catch (err) {
                alert(`网络错误：${err.message}`);
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        // ============================================================
        // 9. 历史报告
        // ============================================================
        async function openHistory() {
            const btn = document.getElementById('history-btn');
            const originalText = btn.innerText;
            btn.innerText = '⏳ 检查中...';
            btn.disabled = true;
            try {
                const resp = await fetch('https://raw.githubusercontent.com/zhetian592/my-crawler-monitor/main/reports/index.html');
                if (resp.ok) {
                    window.open('reports/index.html', '_blank');
                } else {
                    alert('历史报告目录尚未生成。请先运行爬虫任务。');
                }
            } catch (err) {
                alert('无法访问历史报告目录。');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // ============================================================
        // 10. Token 提示
        // ============================================================
        function promptTokenIfNeeded() {
            if (!localStorage.getItem(GITHUB_TOKEN_KEY)) {
                setTimeout(() => {
                    if (!localStorage.getItem(GITHUB_TOKEN_KEY)) {
                        let token = prompt('为提高体验，请填写你的 GitHub Personal Access Token（只需一次）。\n生成地址：https://github.com/settings/tokens（需 repo 权限）', '');
                        if (token) {
                            localStorage.setItem(GITHUB_TOKEN_KEY, token);
                            alert('✅ 令牌已保存，可使用"立即更新"按钮。');
                        }
                    }
                }, 2000);
            }
        }

        window.loadReport = loadReport;
        checkLogin();
    </script>
</body>
</html>

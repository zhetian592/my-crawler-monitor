<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🛡️ 内容安全舆情监控系统</title>
    <!-- marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        /* ========== CSS 变量 & 重置 ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* 浅色主题 */
            --bg-body: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.70);
            --bg-card-solid: #ffffff;
            --text-primary: #0b1121;
            --text-secondary: #3b4a5e;
            --border-color: rgba(255, 255, 255, 0.35);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.15);
            --radius: 20px;
            --glow-color: rgba(56, 189, 248, 0.3);
            --link-color: #2563eb;
            --link-hover: #1d4ed8;
            --gradient-primary: linear-gradient(135deg, #38bdf8, #818cf8);
            --gradient-accent: linear-gradient(135deg, #f472b6, #fb923c);
            --gradient-success: linear-gradient(135deg, #34d399, #60a5fa);
            --gradient-danger: linear-gradient(135deg, #f87171, #f43f5e);
            --gradient-warning: linear-gradient(135deg, #fbbf24, #f59e0b);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --table-header-bg: rgba(241, 245, 249, 0.6);
            --risk-high: #f43f5e;
            --risk-medium: #f59e0b;
            --risk-low: #34d399;
            /* Tooltip */
            --tooltip-bg: rgba(255, 255, 255, 0.95);
            --tooltip-text: #0b1121;
            --tooltip-shadow: 0 12px 48px rgba(0, 0, 0, 0.18);
            --tooltip-border: rgba(255, 255, 255, 0.5);
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-body: #0b1121;
            --bg-card: rgba(26, 35, 50, 0.75);
            --bg-card-solid: #1a2332;
            --text-primary: #f0f4f8;
            --text-secondary: #9aa9b9;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-bg: rgba(26, 35, 50, 0.6);
            --table-header-bg: rgba(30, 41, 59, 0.6);
            --link-color: #6ea8fe;
            --link-hover: #9ec8ff;
            --glow-color: rgba(56, 189, 248, 0.15);
            --tooltip-bg: rgba(26, 35, 50, 0.95);
            --tooltip-text: #f0f4f8;
            --tooltip-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --tooltip-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        /* 背景装饰光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card-solid {
            background: var(--bg-card-solid);
            backdrop-filter: none;
            border: 1px solid var(--border-color);
        }

        /* ===== 顶部导航 ===== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 12px 0 4px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .navbar-brand .logo-icon {
            font-size: 2rem;
            -webkit-text-fill-color: initial;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--glass-bg);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            -webkit-text-fill-color: var(--text-secondary);
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== 按钮样式 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            user-select: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            box-shadow: 0 8px 28px rgba(56, 189, 248, 0.35);
        }
        .btn-danger {
            background: var(--gradient-danger);
            color: white;
            border: none;
        }
        .btn-danger:hover {
            box-shadow: 0 8px 28px rgba(244, 67, 54, 0.35);
        }
        .btn-success {
            background: var(--gradient-success);
            color: white;
            border: none;
        }
        .btn-success:hover {
            box-shadow: 0 8px 28px rgba(52, 211, 153, 0.35);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: var(--glass-bg);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== 统计卡片行 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card-solid);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(56, 189, 248, 0.2);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .stat-number.danger {
            background: var(--gradient-danger);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.warning {
            background: var(--gradient-warning);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.success {
            background: var(--gradient-success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-number.info {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }

        /* ===== 高风险摘要 ===== */
        .high-risk-summary {
            background: var(--bg-card-solid);
            border-radius: 16px;
            padding: 16px 20px;
            border-left: 4px solid #f43f5e;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .high-risk-summary h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .high-risk-summary ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .high-risk-summary li {
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .high-risk-summary li:last-child {
            border-bottom: none;
        }
        .high-risk-summary .risk-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }
        .high-risk-summary .risk-link:hover {
            text-decoration: underline;
        }
        .high-risk-summary .source-tag {
            font-size: 0.7rem;
            background: var(--glass-bg);
            padding: 2px 10px;
            border-radius: 20px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .high-risk-summary .new-badge {
            font-size: 0.6rem;
            background: rgba(56, 189, 248, 0.2);
            color: var(--link-color);
            padding: 1px 8px;
            border-radius: 20px;
            margin-right: 6px;
        }

        /* ===== 报告表格 ===== */
        .report-wrapper {
            overflow-x: auto;
            margin-top: 8px;
        }
        .report-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            border-radius: 12px;
            overflow: hidden;
        }
        .report-wrapper th {
            background: var(--table-header-bg);
            backdrop-filter: blur(8px);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }
        .report-wrapper td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            transition: background 0.15s ease;
        }
        .report-wrapper tbody tr {
            transition: all 0.2s ease;
        }
        .report-wrapper tbody tr:hover {
            background: var(--glass-bg);
        }
        .report-wrapper a {
            color: var(--link-color);
            text-decoration: none;
        }
        .report-wrapper a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* ===== 风险等级标签 ===== */
        .risk-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .risk-tag.high {
            background: rgba(244, 67, 54, 0.15);
            color: #f43f5e;
            box-shadow: 0 0 12px rgba(244, 67, 54, 0.15);
        }
        .risk-tag.medium {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.12);
        }
        .risk-tag.low {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.12);
        }
        .risk-tag.new-high {
            background: rgba(244, 67, 54, 0.25);
            color: #f43f5e;
            box-shadow: 0 0 16px rgba(244, 67, 54, 0.25);
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        /* ============================================================
           风险点：10字截断 + 点击弹窗（方案A）
           ============================================================ */
        .risk-cell {
            position: relative;
            display: inline-block;
            max-width: 100%;
            cursor: pointer;
        }
        .risk-cell .risk-text {
            display: inline;
            border-bottom: 1.5px dashed var(--border-color);
            padding-bottom: 1px;
            transition: border-color 0.2s;
        }
        .risk-cell:hover .risk-text {
            border-color: var(--link-color);
        }
        .risk-cell .ellipsis {
            color: var(--text-secondary);
            font-weight: 600;
        }
        .risk-cell .expand-btn {
            color: var(--link-color);
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: 4px;
            text-decoration: none;
            border-bottom: 1px dashed var(--link-color);
            display: inline-block;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            padding: 0;
            font-family: inherit;
        }
        .risk-cell .expand-btn:hover {
            color: var(--link-hover);
        }

        /* ===== Tooltip 弹窗（点击展开） ===== */
        .risk-tooltip {
            position: fixed;
            max-width: 460px;
            min-width: 220px;
            padding: 14px 18px;
            background: var(--tooltip-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--tooltip-border);
            border-radius: 14px;
            box-shadow: var(--tooltip-shadow);
            color: var(--tooltip-text);
            font-size: 0.85rem;
            line-height: 1.7;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
            transform: translateY(-8px) scale(0.96);
            pointer-events: none;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .risk-tooltip.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .risk-tooltip::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 24px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--tooltip-bg);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.06));
        }
        .risk-tooltip.arrow-top::after {
            bottom: auto;
            top: -8px;
            border-top: none;
            border-bottom: 8px solid var(--tooltip-bg);
        }
        .risk-tooltip .tooltip-label {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 4px;
            opacity: 0.7;
        }
        .risk-tooltip .tooltip-risk-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 30px;
            margin-left: 8px;
            text-transform: uppercase;
        }
        .risk-tooltip .tooltip-risk-badge.high {
            background: rgba(244, 67, 54, 0.15);
            color: #f43f5e;
        }
        .risk-tooltip .tooltip-risk-badge.medium {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        .risk-tooltip .tooltip-risk-badge.low {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }
        .risk-tooltip .tooltip-close {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.7rem;
            color: var(--link-color);
            cursor: pointer;
            border-bottom: 1px dashed var(--link-color);
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            padding: 0;
            font-family: inherit;
        }
        .risk-tooltip .tooltip-close:hover {
            color: var(--link-hover);
        }

        /* ===== 底部 ===== */
        .footer-bar {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 10px;
        }

        /* ===== 加载动画 ===== */
        .loader {
            border: 3px solid var(--border-color);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== 登录覆盖层 ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 17, 33, 0.7);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .login-card {
            background: var(--bg-card-solid);
            padding: 40px 36px;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 340px;
            width: 100%;
            border: 1px solid var(--border-color);
        }
        .login-card h2 {
            margin-bottom: 8px;
            font-size: 1.6rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 40px;
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .login-card input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .login-card .btn {
            width: 100%;
            justify-content: center;
        }
        .error-msg {
            color: #f87171;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 16px;
            }
            .navbar-brand {
                font-size: 1.2rem;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .stat-number {
                font-size: 1.6rem;
            }
            .report-wrapper td,
            .report-wrapper th {
                font-size: 0.75rem;
                padding: 6px 8px;
            }
            .high-risk-summary li {
                font-size: 0.8rem;
            }
            .risk-tooltip {
                max-width: 300px;
                padding: 12px 14px;
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .stat-card {
                padding: 10px 8px;
            }
            .stat-number {
                font-size: 1.3rem;
            }
            .stat-label {
                font-size: 0.6rem;
            }
            .navbar-actions .btn {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
            .risk-tooltip {
                max-width: 260px;
                padding: 10px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== 登录覆盖层 ===== -->
    <div id="loginOverlay" class="login-overlay" style="display:none;">
        <div class="login-card">
            <h2>🔐 系统登录</h2>
            <p>请输入访问密码</p>
            <input type="password" id="passwordInput" placeholder="请输入密码" autofocus>
            <button id="loginBtn" class="btn btn-primary">确认</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div id="app" style="display:none;">
        <div class="container">

            <!-- 导航栏 -->
            <div class="card" style="padding: 16px 24px;">
                <div class="navbar">
                    <div class="navbar-brand">
                        <span class="logo-icon">🛡️</span>
                        内容安全舆情监控
                        <span class="status-badge"><span class="dot"></span> 运行中</span>
                    </div>
                    <div class="navbar-actions">

                    </div>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid" style="display:none;"></div>

            <!-- 高风险摘要 -->
            <div id="highRiskSummary" class="high-risk-summary" style="display:none;">
                <h3>⚠️ 高风险事件 TOP 5</h3>
                <ul id="highRiskList"></ul>
            </div>

            <!-- 报告主表格 -->
            <div class="card">
                <div id="report-content">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- 底部 -->
            <div class="footer-bar">
                <span>⚡ 数据来自定期爬取 | 自动生成涉华负面报告</span>
                <span id="trigger-limit-info"></span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 登录验证
        // ============================================================
        const PASSWORD = 'dzx12123';
        const SESSION_KEY = 'logged_in';

        function checkLogin() {
            if (sessionStorage.getItem(SESSION_KEY) === 'true') {
                document.getElementById('app').style.display = 'block';
                document.getElementById('loginOverlay').style.display = 'none';
                initApp();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                const input = document.getElementById('passwordInput');
                const btn = document.getElementById('loginBtn');
                const errorDiv = document.getElementById('loginError');
                const doLogin = () => {
                    if (input.value === PASSWORD) {
                        sessionStorage.setItem(SESSION_KEY, 'true');
                        document.getElementById('loginOverlay').style.display = 'none';
                        document.getElementById('app').style.display = 'block';
                        initApp();
                    } else {
                        errorDiv.textContent = '密码错误，请重试。';
                        input.value = '';
                        input.focus();
                    }
                };
                btn.onclick = doLogin;
                input.onkeypress = (e) => { if (e.key === 'Enter') doLogin(); };
                input.focus();
            }
        }

        // ============================================================
        // 2. 应用初始化
        // ============================================================
        let currentTheme = localStorage.getItem('theme') || 'auto';
        let countdownInterval = null;
        let activeTooltip = null;

        function initApp() {
            applyTheme();

            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
            document.getElementById('logoutBtn').addEventListener('click', () => {
                sessionStorage.removeItem(SESSION_KEY);
                location.reload();
            });
            document.getElementById('refresh-btn').addEventListener('click', () => loadReport(true));
            document.getElementById('trigger-action-btn').addEventListener('click', triggerWorkflow);
            document.getElementById('history-btn').addEventListener('click', openHistory);

            loadReport(false);
            updateButtonState();
            promptTokenIfNeeded();
        }

        // ============================================================
        // 3. 主题切换
        // ============================================================
        function applyTheme() {
            const html = document.documentElement;
            if (currentTheme === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else if (currentTheme === 'light') {
                html.setAttribute('data-theme', 'light');
            } else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.setAttribute('data-theme', 'dark');
                } else {
                    html.setAttribute('data-theme', 'light');
                }
            }
            localStorage.setItem('theme', currentTheme);
        }

        function toggleTheme() {
            if (currentTheme === 'auto') currentTheme = 'light';
            else if (currentTheme === 'light') currentTheme = 'dark';
            else currentTheme = 'auto';
            applyTheme();
        }

        // ============================================================
        // 4. 工具函数
        // ============================================================
        function convertUtcToBeijing(utcTimeStr) {
            let cleaned = utcTimeStr.replace(' UTC', '').trim();
            let parts = cleaned.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
            if (!parts) return utcTimeStr;
            let year = parseInt(parts[1], 10),
                month = parseInt(parts[2], 10) - 1,
                day = parseInt(parts[3], 10),
                hour = parseInt(parts[4], 10),
                minute = parseInt(parts[5], 10),
                second = parseInt(parts[6], 10);
            let utcDate = new Date(Date.UTC(year, month, day, hour, minute, second));
            let beijingDate = new Date(utcDate.getTime() + 8 * 3600 * 1000);
            let y = beijingDate.getUTCFullYear();
            let m = String(beijingDate.getUTCMonth() + 1).padStart(2, '0');
            let d = String(beijingDate.getUTCDate()).padStart(2, '0');
            let h = String(beijingDate.getUTCHours()).padStart(2, '0');
            let min = String(beijingDate.getUTCMinutes()).padStart(2, '0');
            let sec = String(beijingDate.getUTCSeconds()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}:${sec}`;
        }

        function extractReportTime(text) {
            const patterns = [
                /生成时间[：:]\s*([^\n]+)/,
                /报告时间[：:]\s*([^\n]+)/,
                /(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s*UTC)/,
            ];
            for (let pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) return match[1].trim();
            }
            const lines = text.split('\n');
            for (let line of lines) {
                if (line.includes('UTC') || /^\s*\d{4}-\d{2}-\d{2}/.test(line)) return line.trim();
            }
            return null;
        }

        function extractFetchCount(text) {
            const match = text.match(/抓取数据[：:]\s*(\d+)\s*条/);
            return match ? parseInt(match[1], 10) : 0;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 5. 解析报告表格
        // ============================================================
        function parseReportTable(html) {
            const rows = [];
            const temp = document.createElement('div');
            temp.innerHTML = html;
            const table = temp.querySelector('table');
            if (!table) return rows;
            const tbody = table.querySelector('tbody');
            if (!tbody) return rows;
            const trs = tbody.querySelectorAll('tr');
            trs.forEach(tr => {
                const cells = tr.querySelectorAll('td');
                if (cells.length >= 6) {
                    const eventText = cells[0]?.innerText?.trim() || '';
                    const link = cells[1]?.querySelector('a')?.href || cells[1]?.innerText?.trim() || '';
                    const risk = cells[2]?.innerText?.trim() || '';
                    const source = cells[3]?.innerText?.trim() || '';
                    const timeAgo = cells[4]?.innerText?.trim() || '';
                    let riskLevel = cells[5]?.innerText?.trim() || '';
                    if (riskLevel.includes('高')) riskLevel = '高';
                    else if (riskLevel.includes('中')) riskLevel = '中';
                    else if (riskLevel.includes('低')) riskLevel = '低';
                    else riskLevel = '未知';
                    const isNew = eventText.includes('🆕');
                    rows.push({ eventText, link, risk, source, timeAgo, riskLevel, isNew });
                }
            });
            return rows;
        }

        function parseReportTableFromMarkdown(text) {
            const rows = [];
            const lines = text.split('\n');
            let inTable = false;
            for (let line of lines) {
                if (line.startsWith('|') && line.includes('|')) {
                    if (!inTable) { inTable = true; continue; }
                    if (/^\|[\s\-:]+\|$/.test(line)) continue;
                    const cells = line.split('|').map(c => c.trim()).filter(c => c.length > 0);
                    if (cells.length >= 6) {
                        let eventText = cells[0];
                        let link = '';
                        const linkMatch = cells[1].match(/\[([^\]]*)\]\(([^)]*)\)/);
                        if (linkMatch) link = linkMatch[2];
                        const risk = cells[2] || '';
                        const source = cells[3] || '';
                        const timeAgo = cells[4] || '';
                        let riskLevel = cells[5] || '';
                        if (riskLevel.includes('高')) riskLevel = '高';
                        else if (riskLevel.includes('中')) riskLevel = '中';
                        else if (riskLevel.includes('低')) riskLevel = '低';
                        else riskLevel = '未知';
                        const isNew = eventText.includes('🆕');
                        rows.push({ eventText, link, risk, source, timeAgo, riskLevel, isNew });
                    }
                } else {
                    if (inTable) break;
                }
            }
            return rows;
        }

        // ============================================================
        // 6. 排序函数（新增优先，新增+高风险最优先）
        // ============================================================
        function sortRows(rows) {
            const getPriority = (row) => {
                const isNew = row.isNew || row.eventText.includes('🆕');
                const level = row.riskLevel;
                // 优先级数字越小越靠前
                if (isNew && level === '高') return 1;
                if (isNew && level === '中') return 2;
                if (isNew && level === '低') return 3;
                if (!isNew && level === '高') return 4;
                if (!isNew && level === '中') return 5;
                if (!isNew && level === '低') return 6;
                return 7;
            };
            return [...rows].sort((a, b) => getPriority(a) - getPriority(b));
        }

        // ============================================================
        // 7. 更新统计卡片 + 高风险TOP5
        // ============================================================
        function updateStatsAndHighRisk(rows, fetchCount) {
            const statsGrid = document.getElementById('statsGrid');
            const highRiskSummary = document.getElementById('highRiskSummary');
            const highRiskList = document.getElementById('highRiskList');

            if (!rows || rows.length === 0) {
                statsGrid.style.display = 'none';
                highRiskSummary.style.display = 'none';
                return;
            }

            // 排序后的行用于统计
            const sortedRows = sortRows(rows);

            const total = sortedRows.length;
            const high = sortedRows.filter(r => r.riskLevel === '高').length;
            const medium = sortedRows.filter(r => r.riskLevel === '中').length;
            const low = sortedRows.filter(r => r.riskLevel === '低').length;
            const newCount = sortedRows.filter(r => r.isNew || r.eventText.includes('🆕')).length;

            // 统计卡片：抓取数据 → AI筛选总涉华事件 → 高风险 → 中风险 → 低风险 → 新增
            statsGrid.style.display = 'grid';
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number info">${fetchCount > 0 ? fetchCount : total}</div>
                    <div class="stat-label">📥 抓取数据</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">🎯 AI筛选总涉华事件</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number danger">${high}</div>
                    <div class="stat-label">🔴 高风险</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number warning">${medium}</div>
                    <div class="stat-label">🟠 中风险</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number success">${low}</div>
                    <div class="stat-label">🟢 低风险</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${newCount}</div>
                    <div class="stat-label">🆕 新增</div>
                </div>
            `;

            // 高风险TOP5（使用排序后的数据，优先展示新增的高风险）
            const highRiskItems = sortedRows.filter(r => r.riskLevel === '高').slice(0, 5);
            if (highRiskItems.length > 0) {
                highRiskSummary.style.display = 'block';
                highRiskList.innerHTML = highRiskItems.map(item => {
                    const isNew = item.isNew || item.eventText.includes('🆕');
                    const displayText = item.eventText.replace('🆕', '').trim();
                    const newBadge = isNew ? '<span class="new-badge">🆕</span>' : '';
                    return `<li>
                        ${item.link ? `<a href="${item.link}" target="_blank" class="risk-link">${newBadge}${escapeHtml(displayText)}</a>` : `<span>${newBadge}${escapeHtml(displayText)}</span>`}
                        <span class="source-tag">${escapeHtml(item.source)}</span>
                    </li>`;
                }).join('');
            } else {
                highRiskSummary.style.display = 'none';
            }
        }

        // ============================================================
        // 8. Tooltip 控制（方案A：点击展开弹窗）
        // ============================================================
        let tooltipInstance = null;
        let tooltipTimeout = null;

        function createTooltip() {
            if (tooltipInstance) return tooltipInstance;
            const el = document.createElement('div');
            el.className = 'risk-tooltip';
            el.innerHTML = `
                <div class="tooltip-label">📌 风险分析</div>
                <div class="tooltip-body"></div>
                <button class="tooltip-close">收起</button>
            `;
            document.body.appendChild(el);
            tooltipInstance = el;

            // 点击"收起"关闭
            el.querySelector('.tooltip-close').addEventListener('click', function(e) {
                e.stopPropagation();
                hideTooltipImmediately();
            });

            return el;
        }

        function showTooltip(event, text, riskLevel) {
            const tooltip = createTooltip();
            const body = tooltip.querySelector('.tooltip-body');

            const levelClass = riskLevel === '高' ? 'high' : riskLevel === '中' ? 'medium' : 'low';
            body.innerHTML = `
                ${escapeHtml(text)}
                <span class="tooltip-risk-badge ${levelClass}">${escapeHtml(riskLevel)}</span>
            `;

            // 定位
            const rect = event.currentTarget.getBoundingClientRect();
            const tooltipWidth = Math.min(460, window.innerWidth - 40);
            const tooltipHeight = tooltip.offsetHeight || 200;

            let left = rect.left + rect.width / 2 - tooltipWidth / 2;
            let top = rect.top - tooltipHeight - 14;

            if (left < 20) left = 20;
            if (left + tooltipWidth > window.innerWidth - 20) {
                left = window.innerWidth - tooltipWidth - 20;
            }
            if (top < 20) {
                top = rect.bottom + 14;
                tooltip.classList.add('arrow-top');
            } else {
                tooltip.classList.remove('arrow-top');
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            tooltip.style.maxWidth = Math.min(460, window.innerWidth - 40) + 'px';

            clearTimeout(tooltipTimeout);
            tooltip.classList.add('visible');
            activeTooltip = tooltip;
        }

        function hideTooltipImmediately() {
            clearTimeout(tooltipTimeout);
            if (tooltipInstance) {
                tooltipInstance.classList.remove('visible');
                activeTooltip = null;
            }
        }

        // 点击页面其他区域隐藏
        document.addEventListener('click', function(e) {
            if (activeTooltip && !e.target.closest('.risk-cell') && !e.target.closest('.risk-tooltip')) {
                hideTooltipImmediately();
            }
        });

        // ============================================================
        // 9. 加载报告
        // ============================================================
        let lastReportHash = localStorage.getItem('lastReportHash') || '';

        function simpleHash(text) {
            return text.slice(0, 200) + text.length;
        }

        async function loadReport(showAlert = true) {
            const reportDiv = document.getElementById('report-content');
            reportDiv.innerHTML = '<div class="loader"></div>';

            hideTooltipImmediately();

            try {
                const response = await fetch('https://raw.githubusercontent.com/zhetian592/my-crawler-monitor/main/report.md');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const currentHash = simpleHash(text);

                let rawTime = extractReportTime(text);
                let displayTime = rawTime ? convertUtcToBeijing(rawTime) : '未知';
                document.getElementById('report-time-display').textContent = `📅 ${displayTime}`;

                // 提取抓取数据
                const fetchCount = extractFetchCount(text);

                // 解析Markdown（从表格开始的位置）
                const tableStart = text.indexOf('| 事件简述');
                const tableText = tableStart > 0 ? text.substring(tableStart) : text;
                let html = marked.parse(tableText);

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                tempDiv.querySelectorAll('a').forEach(link => {
                    if (link.href && !link.href.startsWith('#')) {
                        link.setAttribute('target', '_blank');
                        link.setAttribute('rel', 'noopener noreferrer');
                    }
                });

                // ============================================================
                // 方案A：风险点10字截断 + 点击弹窗
                // ============================================================
                const tables = tempDiv.querySelectorAll('table');
                tables.forEach(table => {
                    const rows = table.querySelectorAll('tbody tr');
                    rows.forEach(row => {
                        const cells = row.querySelectorAll('td');
                        if (cells.length >= 6) {
                            const riskCell = cells[2];
                            const fullText = riskCell.textContent.trim();

                            let riskLevel = '未知';
                            const levelText = cells[5]?.textContent?.trim() || '';
                            if (levelText.includes('高')) riskLevel = '高';
                            else if (levelText.includes('中')) riskLevel = '中';
                            else if (levelText.includes('低')) riskLevel = '低';

                            if (fullText.length > 10) {
                                const shortText = fullText.substring(0, 10);
                                const wrapper = document.createElement('span');
                                wrapper.className = 'risk-cell';
                                wrapper.dataset.fullText = fullText;
                                wrapper.dataset.riskLevel = riskLevel;

                                const textSpan = document.createElement('span');
                                textSpan.className = 'risk-text';
                                textSpan.textContent = shortText;
                                wrapper.appendChild(textSpan);

                                const ellipsis = document.createElement('span');
                                ellipsis.className = 'ellipsis';
                                ellipsis.textContent = '...';
                                wrapper.appendChild(ellipsis);

                                const expandBtn = document.createElement('button');
                                expandBtn.className = 'expand-btn';
                                expandBtn.textContent = '展开';
                                expandBtn.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    // 如果已经显示该单元格的tooltip，则关闭
                                    if (activeTooltip && activeTooltip.dataset?.source === wrapper) {
                                        hideTooltipImmediately();
                                        return;
                                    }
                                    showTooltip({ currentTarget: wrapper }, wrapper.dataset.fullText,
                                        wrapper.dataset.riskLevel);
                                    if (activeTooltip) {
                                        activeTooltip.dataset.source = wrapper;
                                    }
                                });
                                wrapper.appendChild(expandBtn);

                                riskCell.innerHTML = '';
                                riskCell.appendChild(wrapper);
                            } else {
                                riskCell.innerHTML =
                                    `<span class="risk-cell" style="cursor:default;">${escapeHtml(fullText)}</span>`;
                            }
                        }
                    });
                });

                // ===== 事件简述链接化 =====
                const rowsFromMarkdown = parseReportTableFromMarkdown(tableText);
                tables.forEach(table => {
                    const tbody = table.querySelector('tbody');
                    if (!tbody) return;
                    const trs = tbody.querySelectorAll('tr');
                    trs.forEach((tr, idx) => {
                        const cells = tr.querySelectorAll('td');
                        if (cells.length >= 6 && idx < rowsFromMarkdown.length) {
                            const rowData = rowsFromMarkdown[idx];
                            if (rowData && rowData.link) {
                                const eventCell = cells[0];
                                const originalText = eventCell.textContent.trim();
                                eventCell.innerHTML =
                                    `<a href="${escapeHtml(rowData.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(originalText)}</a>`;
                            }
                        }
                    });
                });

                html = tempDiv.innerHTML;
                reportDiv.innerHTML = `<div class="report-wrapper">${html}</div>`;

                // 解析数据用于统计（使用排序后的数据）
                const parsedRows = parseReportTable(html);
                // 重新解析排序（确保isNew正确）
                const sortedRows = sortRows(parsedRows);

                // 重新构建表格：按排序后的顺序重新排列行
                const table = reportDiv.querySelector('.report-wrapper table');
                if (table) {
                    const tbody = table.querySelector('tbody');
                    if (tbody) {
                        const trs = tbody.querySelectorAll('tr');
                        // 将行数据与DOM行关联
                        const rowDataMap = [];
                        trs.forEach((tr, idx) => {
                            if (idx < sortedRows.length) {
                                rowDataMap.push({ tr, data: sortedRows[idx] });
                            }
                        });
                        // 按排序顺序重新排列
                        // 由于排序已在前端完成，直接按sortedRows顺序重排DOM行
                        const sortedTrs = rowDataMap.sort((a, b) => {
                            const priA = sortedRows.indexOf(a.data);
                            const priB = sortedRows.indexOf(b.data);
                            return priA - priB;
                        });
                        // 重新插入
                        sortedTrs.forEach((item, idx) => {
                            tbody.appendChild(item.tr);
                        });
                    }
                }

                // 更新统计（使用排序后的数据）
                updateStatsAndHighRisk(sortedRows, fetchCount);

                // 添加水平滚动提示
                const wrapper = reportDiv.querySelector('.report-wrapper');
                if (wrapper && wrapper.scrollWidth > wrapper.clientWidth) {
                    if (!reportDiv.querySelector('.scroll-hint')) {
                        const hint = document.createElement('div');
                        hint.className = 'scroll-hint';
                        hint.style.cssText = 'text-align:right;font-size:0.7rem;color:var(--text-secondary);margin:4px 0;';
                        hint.textContent = '👆 表格可左右滑动';
                        reportDiv.prepend(hint);
                    }
                }

                if (currentHash !== lastReportHash) {
                    if (showAlert) alert('✅ 报告已刷新！');
                    localStorage.setItem('lastReportHash', currentHash);
                    lastReportHash = currentHash;
                }

            } catch (err) {
                reportDiv.innerHTML = `<div style="color:#f87171;background:rgba(244,67,54,0.08);padding:20px;border-radius:16px;">
                    <strong>⚠️ 加载失败</strong><br>${escapeHtml(err.message)}<br><br>
                    <button class="btn btn-primary" onclick="loadReport(true)">🔄 重试</button>
                    <p style="margin-top:12px;font-size:0.85rem;">👉 请确认 <strong>report.md</strong> 文件已生成。<br>若尚未运行爬虫，请点击"立即更新"按钮触发任务。</p>
                </div>`;
                if (showAlert) alert(`❌ 报告刷新失败：${err.message}`);
            }
        }

        // ============================================================
        // 10. GitHub Actions 触发
        // ============================================================
        const REPO_OWNER = 'zhetian592';
        const REPO_NAME = 'my-crawler-monitor';
        const WORKFLOW_ID = 'crawler-tier1.yml';
        const GITHUB_TOKEN_KEY = 'github_pat';

        async function fetchLastRunTime() {
            try {
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/runs?per_page=1`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('无法获取工作流运行信息');
                const data = await response.json();
                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const lastRun = data.workflow_runs[0];
                    const createdAt = new Date(lastRun.created_at);
                    const now = new Date();
                    const elapsedSeconds = (now - createdAt) / 1000;
                    const remaining = 3600 - elapsedSeconds;
                    return remaining > 0 ? Math.ceil(remaining) : 0;
                }
                return 0;
            } catch (err) {
                console.warn('获取工作流最后运行时间失败:', err);
                return 0;
            }
        }

        async function updateButtonState() {
            const btn = document.getElementById('trigger-action-btn');
            const remaining = await fetchLastRunTime();
            if (remaining > 0) {
                btn.disabled = true;
                btn.textContent = `⏳ 等待 ${Math.floor(remaining/60)}分${remaining%60}秒`;
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(async () => {
                    const newRemaining = await fetchLastRunTime();
                    if (newRemaining <= 0) {
                        btn.disabled = false;
                        btn.textContent = '🚀 立即更新';
                        if (countdownInterval) clearInterval(countdownInterval);
                    } else {
                        btn.textContent = `⏳ 等待 ${Math.floor(newRemaining/60)}分${newRemaining%60}秒`;
                    }
                }, 1000);
            } else {
                btn.disabled = false;
                btn.textContent = '🚀 立即更新';
                if (countdownInterval) clearInterval(countdownInterval);
            }
        }

        async function triggerWorkflow() {
            const remaining = await fetchLastRunTime();
            if (remaining > 0) {
                alert(`请等待 ${Math.floor(remaining/60)}分${remaining%60}秒后再试。`);
                return;
            }
            let token = localStorage.getItem(GITHUB_TOKEN_KEY);
            if (!token) {
                token = prompt('请填写你的 GitHub Personal Access Token (需要 repo 权限)：\n生成地址：https://github.com/settings/tokens\n令牌将保存在本地。');
                if (!token) return;
                localStorage.setItem(GITHUB_TOKEN_KEY, token);
            }
            const btn = document.getElementById('trigger-action-btn');
            const originalText = btn.innerText;
            btn.innerText = '⏳ 触发中...';
            btn.disabled = true;
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ref: 'main' })
                });
                if (response.ok) {
                    alert('✅ 已触发爬虫任务！\n稍等几分钟后点击"刷新"查看结果。');
                    await updateButtonState();
                } else {
                    const error = await response.json();
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem(GITHUB_TOKEN_KEY);
                        alert('令牌无效或已过期，请重新输入。');
                    } else {
                        alert(`❌ 触发失败 (${response.status}): ${error.message || '未知错误'}`);
                    }
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            } catch (err) {
                alert(`网络错误：${err.message}`);
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        // ============================================================
        // 11. 历史报告
        // ============================================================
        async function openHistory() {
            const btn = document.getElementById('history-btn');
            const originalText = btn.innerText;
            btn.innerText = '⏳ 检查中...';
            btn.disabled = true;
            try {
                const response = await fetch('https://raw.githubusercontent.com/zhetian592/my-crawler-monitor/main/reports/index.html');
                if (response.ok) {
                    window.open('reports/index.html', '_blank');
                } else {
                    alert('历史报告目录尚未生成。请先运行爬虫任务。');
                }
            } catch (err) {
                alert('无法访问历史报告目录。');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // ============================================================
        // 12. Token 提示
        // ============================================================
        function promptTokenIfNeeded() {
            if (!localStorage.getItem(GITHUB_TOKEN_KEY)) {
                setTimeout(() => {
                    if (!localStorage.getItem(GITHUB_TOKEN_KEY)) {
                        let token = prompt('为提高体验，请填写你的 GitHub Personal Access Token（只需一次）。\n生成地址：https://github.com/settings/tokens（需 repo 权限）\n令牌保存在本地，不会上传。', '');
                        if (token) {
                            localStorage.setItem(GITHUB_TOKEN_KEY, token);
                            alert('✅ 令牌已保存，可使用"立即更新"按钮。');
                        }
                    }
                }, 2000);
            }
        }

        // 暴露函数给全局
        window.loadReport = loadReport;

        // ============================================================
        // 启动
        // ============================================================
        checkLogin();
    </script>
</body>
</html>

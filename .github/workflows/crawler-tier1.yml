name: Tier1 - Manual
on:
  workflow_dispatch:

concurrency:
  group: tier1-manual
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start RSS proxy
        run: |
          python rss_proxy.py --port 1200 &
          sleep 3
          curl -s http://localhost:1200/health

      - name: Run crawler
        env:
          # 使用 ChatAnywhere 的 API Key（GitHub Secret 中已设置）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 以下两项可选，代码中已有默认值，但显式指定更清晰
          OPENAI_BASE_URL: "https://api.chatanywhere.tech/v1"
          AI_MODEL: "gpt-4o-mini"
        run: python crawler.py

      - name: Generate commit message
        id: msg
        run: |
          echo "COMMIT_MSG=Manual update $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ env.COMMIT_MSG }}
          file_pattern: "data/* report.md report.html reports/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

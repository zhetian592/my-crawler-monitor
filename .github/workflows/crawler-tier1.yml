name: Tier1 - Manual
on:
  workflow_dispatch:

concurrency:
  group: tier1-manual
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 仍可使用 PAT_TOKEN（如果需要触发其他工作流），但最好也更新此令牌
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start RSS proxy
        run: |
          python rss_proxy.py --port 1200 &
          sleep 3
          curl -s http://localhost:1200/health

      - name: Run crawler
        env:
          # 替换为 OpenRouter API Key（你已经在 Secrets 中有了 OPENROUTER_API_KEY）
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # 可选：如需换模型，可设置 AI_MODEL
          # AI_MODEL: "google/gemini-2.0-flash-lite-preview-02-05"
        run: python crawler.py

      - name: Generate commit message
        id: msg
        run: |
          echo "COMMIT_MSG=Manual update $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ env.COMMIT_MSG }}
          file_pattern: "data/* report.md report.html reports/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          # 使用默认的 GITHUB_TOKEN，无需额外维护
          token: ${{ secrets.GITHUB_TOKEN }}
        # 删除 env: GITHUB_TOKEN 部分，因为上面已经用 token 参数传递

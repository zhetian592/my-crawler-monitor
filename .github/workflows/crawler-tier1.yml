name: Tier1 - Manual
on:
  workflow_dispatch:

# 防止同一工作流多次手动触发同时运行导致排队
concurrency:
  group: tier1-manual
  cancel-in-progress: false   # 后触发的排队等待，不会取消正在运行的

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start RSS proxy
        run: |
          python rss_proxy.py --port 1200 &
          sleep 3
          curl -s http://localhost:1200/health

      - name: Run crawler
        env:
          # 🔑 关键修改：使用新令牌 Secret（GH_MODELS_TOKEN_NEW）
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN_NEW }}
        run: python crawler.py

      - name: Generate commit message
        id: msg
        run: |
          echo "COMMIT_MSG=Manual update $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ env.COMMIT_MSG }}
          file_pattern: "data/* report.md report.html reports/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
